   </g>
   <g id="text_2">
    <text style="font-size: 9.3px; font-family: 'DejaVu Sans'; fill: #263746" transform="translate(26.586 56.840147)">16,908 retrieved records</text>
    <text style="font-size: 9.3px; font-family: 'DejaVu Sans'; fill: #263746" transform="translate(26.586 69.232746)">571 exact title-and-body duplicates</text>
    <text style="font-size: 9.3px; font-family: 'DejaVu Sans'; fill: #263746" transform="translate(26.586 81.625344)">16,337 retained records</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 10.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #168b87" x="253.692" y="35.803913" transform="rotate(-0 253.692 35.803913)">02  Screen retained records</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9.3px; font-family: 'DejaVu Sans'; fill: #263746" transform="translate(253.692 56.840147)">5,322 main candidates</text>
    <text style="font-size: 9.3px; font-family: 'DejaVu Sans'; fill: #263746" transform="translate(253.692 69.232746)">1,045 boundary records</text>
    <text style="font-size: 9.3px; font-family: 'DejaVu Sans'; fill: #263746" transform="translate(253.692 81.625344)">9,970 reserve records</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 10.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #168b87" x="480.798" y="35.803913" transform="rotate(-0 480.798 35.803913)">03  Assemble main corpus</text>
   </g>
   <g id="text_6">
    <text style="font-size: 9.3px; font-family: 'DejaVu Sans'; fill: #263746" transform="translate(480.798 56.840147)">912 specialized policy candidates</text>
    <text style="font-size: 9.3px; font-family: 'DejaVu Sans'; fill: #263746" transform="translate(480.798 69.232746)">47 implementation/process records</text>
    <text style="font-size: 9.3px; font-family: 'DejaVu Sans'; fill: #263746" transform="translate(480.798 81.625344)">4,363 broader measure-bearing records</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 10.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #173b57" x="26.586" y="176.621513" transform="rotate(-0 26.586 176.621513)">04  Apply the same measurement to all 5,322 main candidates</text>
   </g>
   <g id="text_8">
    <text style="font-size: 9.3px; font-family: 'DejaVu Sans'; fill: #263746" transform="translate(26.586 197.657747)">Extract eldercare-related passages and apply the fixed 20-category dictionary to each fragment.</text>
    <text style="font-size: 9.3px; font-family: 'DejaVu Sans'; fill: #263746" transform="translate(26.586 210.050346)">Record document-level hits; retain candidates with no extracted passage in the denominator.</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 10.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #173b57" x="26.586" y="291.382313" transform="rotate(-0 26.586 291.382313)">Service profiles and trends</text>
   </g>
   <g id="text_10">
    <text style="font-size: 9.3px; font-family: 'DejaVu Sans'; fill: #263746" transform="translate(26.586 312.418547)">Full main corpus and broader subsets</text>
    <text style="font-size: 9.3px; font-family: 'DejaVu Sans'; fill: #263746" transform="translate(26.586 324.811146)">Three-period and annual profiles</text>
    <text style="font-size: 9.3px; font-family: 'DejaVu Sans'; fill: #263746" transform="translate(26.586 337.203744)">2011–2022 for the plotted trends</text>
    <text style="font-size: 9.3px; font-family: 'DejaVu Sans'; fill: #263746" transform="translate(26.586 349.596343)">Figures 2 and 3</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 10.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #cb8b2c" x="253.692" y="291.382313" transform="rotate(-0 253.692 291.382313)">Focused period comparison</text>
   </g>
   <g id="text_12">
    <text style="font-size: 9.3px; font-family: 'DejaVu Sans'; fill: #263746" transform="translate(253.692 312.418547)">Broader candidates: 1,807 vs 1,404</text>
    <text style="font-size: 9.3px; font-family: 'DejaVu Sans'; fill: #263746" transform="translate(253.692 324.811146)">2015–2018 vs 2019–2022</text>
