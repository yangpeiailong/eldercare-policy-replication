   <g id="text_1">
    <text style="font-weight: 700; font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #173b57" x="17.1" y="27.5976" transform="rotate(-0 17.1 27.5976)">CORPUS CONSTRUCTION AND ANALYSIS</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 10.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #173b57" x="26.586" y="74.611912" transform="rotate(-0 26.586 74.611912)">01  Retrieve and deduplicate</text>
   </g>
   <g id="text_3">
    <text style="font-size: 9.3px; font-family: 'DejaVu Sans'; fill: #263746" transform="translate(26.586 95.648147)">16,908 retrieved records</text>
    <text style="font-size: 9.3px; font-family: 'DejaVu Sans'; fill: #263746" transform="translate(26.586 108.040746)">571 exact title-and-body duplicates</text>
    <text style="font-size: 9.3px; font-family: 'DejaVu Sans'; fill: #263746" transform="translate(26.586 120.433344)">16,337 retained records</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 10.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #168b87" x="253.692" y="74.611912" transform="rotate(-0 253.692 74.611912)">02  Screen retained records</text>
   </g>
   <g id="text_5">
    <text style="font-size: 9.3px; font-family: 'DejaVu Sans'; fill: #263746" transform="translate(253.692 95.648147)">5,322 main candidates</text>
    <text style="font-size: 9.3px; font-family: 'DejaVu Sans'; fill: #263746" transform="translate(253.692 108.040746)">1,045 boundary records</text>
    <text style="font-size: 9.3px; font-family: 'DejaVu Sans'; fill: #263746" transform="translate(253.692 120.433344)">9,970 reserve records</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 10.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #168b87" x="480.798" y="74.611912" transform="rotate(-0 480.798 74.611912)">03  Assemble main corpus</text>
   </g>
   <g id="text_7">
    <text style="font-size: 9.3px; font-family: 'DejaVu Sans'; fill: #263746" transform="translate(480.798 95.648147)">912 specialized policy candidates</text>
    <text style="font-size: 9.3px; font-family: 'DejaVu Sans'; fill: #263746" transform="translate(480.798 108.040746)">47 implementation/process records</text>
    <text style="font-size: 9.3px; font-family: 'DejaVu Sans'; fill: #263746" transform="translate(480.798 120.433344)">4,363 broader measure-bearing records</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 10.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #173b57" x="26.586" y="215.429512" transform="rotate(-0 26.586 215.429512)">04  Apply the same measurement to all 5,322 main candidates</text>
   </g>
   <g id="text_9">
    <text style="font-size: 9.3px; font-family: 'DejaVu Sans'; fill: #263746" transform="translate(26.586 236.465747)">Extract eldercare-related passages and apply the fixed 20-category dictionary to each fragment.</text>
    <text style="font-size: 9.3px; font-family: 'DejaVu Sans'; fill: #263746" transform="translate(26.586 248.858346)">Record document-level hits; retain candidates with no extracted passage in the denominator.</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 10.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #173b57" x="26.586" y="330.190312" transform="rotate(-0 26.586 330.190312)">Service profiles and trends</text>
   </g>
   <g id="text_11">
    <text style="font-size: 9.3px; font-family: 'DejaVu Sans'; fill: #263746" transform="translate(26.586 351.226547)">Full main corpus and broader subsets</text>
    <text style="font-size: 9.3px; font-family: 'DejaVu Sans'; fill: #263746" transform="translate(26.586 363.619146)">Three-period and annual profiles</text>
    <text style="font-size: 9.3px; font-family: 'DejaVu Sans'; fill: #263746" transform="translate(26.586 376.011744)">2011–2022 for the plotted trends</text>
    <text style="font-size: 9.3px; font-family: 'DejaVu Sans'; fill: #263746" transform="translate(26.586 388.404343)">Figures 2 and 3</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 10.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #cb8b2c" x="253.692" y="330.190312" transform="rotate(-0 253.692 330.190312)">Focused period comparison</text>
   </g>
   <g id="text_13">
    <text style="font-size: 9.3px; font-family: 'DejaVu Sans'; fill: #263746" transform="translate(253.692 351.226547)">Broader candidates: 1,807 vs 1,404</text>
    <text style="font-size: 9.3px; font-family: 'DejaVu Sans'; fill: #263746" transform="translate(253.692 363.619146)">2015–2018 vs 2019–2022</text>
    <text style="font-size: 9.3px; font-family: 'DejaVu Sans'; fill: #263746" transform="translate(253.692 376.011744)">Raw and standardized rates; checks</text>
    <text style="font-size: 9.3px; font-family: 'DejaVu Sans'; fill: #263746" transform="translate(253.692 388.404343)">Table 2 and Figure 4</text>
   </g>
   <g id="text_14">
    <text style="font-weight: 700; font-size: 10.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #168b87" x="480.798" y="330.190312" transform="rotate(-0 480.798 330.190312)">Joint mentions and context</text>
   </g>
   <g id="text_15">
    <text style="font-size: 9.3px; font-family: 'DejaVu Sans'; fill: #263746" transform="translate(480.798 351.226547)">Same 3,211 broader candidates</text>
    <text style="font-size: 9.3px; font-family: 'DejaVu Sans'; fill: #263746" transform="translate(480.798 363.619146)">Count shared and separate fragments</text>
    <text style="font-size: 9.3px; font-family: 'DejaVu Sans'; fill: #263746" transform="translate(480.798 376.011744)">Read selected passages for context</text>
    <text style="font-size: 9.3px; font-family: 'DejaVu Sans'; fill: #263746" transform="translate(480.798 388.404343)">Figure 5</text>
   </g>
   <g id="text_16">
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #7c8792" x="17.1" y="431.2008" transform="rotate(-0 17.1 431.2008)">Boundary and reserve records are outside the main analysis. Co-presence alone does not establish policy integration.</text>
   </g>
  </g>
 </g>
